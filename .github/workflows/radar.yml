name: Radar VoltSync

# RAMO DESCARTÁVEL (probe/ndr-base): nesta versão o workflow só corre a sonda
# probe/ndr_probe.py — não lê anúncios nem faz commit de dados.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-sonda
  cancel-in-progress: false

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Sonda
        run: python probe/ndr_probe.py
