name: Sonda numeroanuncio (temporária)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Sonda
        run: python probe/ndr_probe.py
